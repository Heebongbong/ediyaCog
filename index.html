<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이디야 선결제 장부</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #222;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .header {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 26px; }
    h2 { margin-top: 0; }
    .muted { color: #777; font-size: 13px; }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 15px 0;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .primary { background: #1d4f91; color: white; }
    .secondary { background: #e9eef6; color: #223; }
    .danger { background: #b42318; color: white; }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      padding: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 13px 10px;
      text-align: left;
    }
    th { background: #fafafa; font-size: 14px; }
    .name-link {
      color: #1d4f91;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .money { font-weight: 700; }
    .empty {
      text-align: center;
      color: #888;
      padding: 36px 12px;
    }
    .hidden { display: none !important; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #555;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      border: 1px solid #d7dbe2;
      border-radius: 8px;
      padding: 11px;
      font: inherit;
    }
    textarea { resize: vertical; min-height: 90px; }
    .balance-box {
      padding: 18px;
      border-radius: 10px;
      background: #f1f5fb;
      margin-bottom: 18px;
    }
    .balance-box strong { font-size: 28px; color: #1d4f91; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal-box {
      background: white;
      width: min(760px, 100%);
      max-height: 82vh;
      overflow: auto;
      border-radius: 12px;
      padding: 20px;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .status {
      min-height: 22px;
      margin: 10px 0;
      font-size: 14px;
      color: #1d4f91;
    }

    @media (max-width: 640px) {
      .detail-grid { grid-template-columns: 1fr; }
      th:nth-child(3), td:nth-child(3) { width: 78px; }
      .header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>이디야 선결제 장부</h1>
        <div class="muted">서버 없이 JSON 파일로 관리</div>
      </div>
      <div id="fileName" class="muted">JSON 미연결</div>
    </div>

    <section id="listView">
      <div class="toolbar">
        <button class="primary" id="openBtn">장부 JSON 열기</button>
        <button class="secondary" id="saveBtn">JSON 저장</button>
      </div>

      <div style="margin: 14px 0;">
        <label for="searchInput">이름 검색</label>
        <input
          id="searchInput"
          type="search"
          placeholder="이름을 입력하세요"
          autocomplete="off"
        />
      </div>

      <div id="status" class="status"></div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>선결제 잔액</th>
              <th>로그</th>
            </tr>
          </thead>
          <tbody id="customerRows">
            <tr><td colspan="3" class="empty">먼저 data.json 파일을 열어주세요.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="detailView" class="hidden">
      <div class="toolbar">
        <button class="secondary" id="backBtn">← 목록으로</button>
      </div>

      <div class="card">
        <h2 id="detailName">고객 상세</h2>
        <div class="balance-box">
          현재 잔액<br>
          <strong id="detailBalance">0원</strong>
        </div>

        <div class="detail-grid">
          <div>
            <label for="orderInput">이번 주문 내용</label>
            <textarea id="orderInput" placeholder="예: 아이스 아메리카노 2잔"></textarea>
          </div>
          <div>
            <label for="amountInput">차감 가격</label>
            <input id="amountInput" type="number" min="0" step="100" placeholder="예: 6400" />
          </div>
        </div>

        <div class="toolbar">
          <button class="primary" id="deductBtn">차감 적용 + JSON 저장</button>
        </div>
        <div id="detailStatus" class="status"></div>
      </div>
    </section>
  </div>

  <div id="logModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="logTitle" style="margin:0">사용 로그</h2>
        <button class="secondary" id="closeLogBtn">닫기</button>
      </div>
      <div id="logContent"></div>
    </div>
  </div>

<script>
let ledger = null;
let fileHandle = null;
let selectedCustomerId = null;
let editingLogCustomerId = null;
let editingLogIndex = null;

const $ = (id) => document.getElementById(id);
const won = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";

function setStatus(msg) {
  $("status").textContent = msg || "";
}

function renderList() {
  const tbody = $("customerRows");
  tbody.innerHTML = "";

  if (!ledger || !Array.isArray(ledger.customers) || ledger.customers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty">고객 데이터가 없습니다.</td></tr>';
    return;
  }

  const keyword = $("searchInput").value.trim().toLowerCase();
  const customers = ledger.customers.filter(customer =>
    String(customer.name || "").toLowerCase().includes(keyword)
  );

  if (customers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty">검색 결과가 없습니다.</td></tr>';
    return;
  }

  customers.forEach(customer => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="name-link" data-id="${customer.id}">${escapeHtml(customer.name)}</span></td>
      <td class="money">${won(customer.balance)}</td>
      <td><button class="secondary log-btn" data-id="${customer.id}">보기</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.querySelectorAll(".name-link").forEach(el => {
    el.addEventListener("click", () => openDetail(Number(el.dataset.id)));
  });

  document.querySelectorAll(".log-btn").forEach(el => {
    el.addEventListener("click", () => openLog(Number(el.dataset.id)));
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = String(text ?? "");
  return div.innerHTML;
}

async function openJson() {
  if (!window.showOpenFilePicker) {
    alert("이 기능은 Chrome/Edge 계열 브라우저에서 사용하는 것을 권장합니다.");
    return;
  }

  try {
    [fileHandle] = await window.showOpenFilePicker({
      types: [{
        description: "JSON 장부 파일",
        accept: { "application/json": [".json"] }
      }],
      multiple: false
    });

    const file = await fileHandle.getFile();
    const text = await file.text();
    ledger = JSON.parse(text);

    if (!ledger.customers || !Array.isArray(ledger.customers)) {
      throw new Error("customers 배열이 없습니다.");
    }

    $("fileName").textContent = file.name;
    setStatus("장부를 불러왔습니다.");
    renderList();
  } catch (err) {
    if (err.name !== "AbortError") {
      console.error(err);
      alert("JSON 파일을 읽지 못했습니다. 파일 형식을 확인해주세요.");
    }
  }
}

async function saveJson() {
  if (!ledger) {
    alert("먼저 JSON 파일을 열어주세요.");
    return false;
  }

  const text = JSON.stringify(ledger, null, 2);

  if (fileHandle && window.showSaveFilePicker) {
    try {
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      setStatus("JSON 파일에 저장했습니다.");
      return true;
    } catch (err) {
      console.error(err);
      alert("파일 저장에 실패했습니다.");
      return false;
    }
  }

  // File System Access API를 쓸 수 없는 경우 다운로드 백업
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "data.json";
  a.click();
  URL.revokeObjectURL(url);
  return true;
}

function openDetail(id) {
  const customer = ledger.customers.find(c => Number(c.id) === Number(id));
  if (!customer) return;

  selectedCustomerId = id;
  $("detailName").textContent = customer.name;
  $("detailBalance").textContent = won(customer.balance);
  $("orderInput").value = "";
  $("amountInput").value = "";
  $("detailStatus").textContent = "";

  $("listView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
}

function backToList() {
  selectedCustomerId = null;
  $("detailView").classList.add("hidden");
  $("listView").classList.remove("hidden");
  renderList();
}

async function deduct() {
  if (!ledger || selectedCustomerId == null) return;

  const customer = ledger.customers.find(c => Number(c.id) === Number(selectedCustomerId));
  if (!customer) return;

  const order = $("orderInput").value.trim();
  const amount = Number($("amountInput").value);

  if (!order) {
    alert("주문 내용을 입력해주세요.");
    return;
  }
  if (!Number.isFinite(amount) || amount <= 0) {
    alert("차감 가격을 올바르게 입력해주세요.");
    return;
  }
  if (amount > Number(customer.balance)) {
    alert("차감 금액이 현재 잔액보다 큽니다.");
    return;
  }

  const oldBalance = Number(customer.balance);
  const newBalance = oldBalance - amount;
  customer.balance = newBalance;
  customer.logs = Array.isArray(customer.logs) ? customer.logs : [];

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ` +
    `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  customer.logs.unshift({
    date: stamp,
    order,
    amount,
    balance: newBalance
  });

  const saved = await saveJson();
  if (!saved) {
    customer.balance = oldBalance;
    customer.logs.shift();
    return;
  }

  $("detailBalance").textContent = won(newBalance);
  $("detailStatus").textContent = `${won(amount)} 차감했습니다.`;
  $("orderInput").value = "";
  $("amountInput").value = "";
}

function openLog(id) {
  const customer = ledger.customers.find(c => Number(c.id) === Number(id));
  if (!customer) return;

  $("logTitle").textContent = `${customer.name} 사용 로그`;
  const logs = Array.isArray(customer.logs) ? customer.logs : [];

  if (logs.length === 0) {
    $("logContent").innerHTML = '<div class="empty">사용 로그가 없습니다.</div>';
  } else {
    $("logContent").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>내용</th>
            <th>차감</th>
            <th>잔액</th>
            <th>수정</th>
          </tr>
        </thead>
        <tbody>
          ${logs.map((log, index) => `
            <tr>
              <td>${escapeHtml(log.date)}</td>
              <td>${escapeHtml(log.order)}</td>
              <td>${won(log.amount)}</td>
              <td>${won(log.balance)}</td>
              <td><button class="secondary edit-log-btn" data-id="${customer.id}" data-index="${index}">수정</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    document.querySelectorAll(".edit-log-btn").forEach(btn => {
      btn.addEventListener("click", () => openEditLog(Number(btn.dataset.id), Number(btn.dataset.index)));
    });
  }

  $("logModal").classList.remove("hidden");
}

function openEditLog(customerId, logIndex) {
  const customer = ledger.customers.find(c => Number(c.id) === Number(customerId));
  if (!customer || !customer.logs?.[logIndex]) return;

  editingLogCustomerId = customerId;
  editingLogIndex = logIndex;
  $("editOrderInput").value = customer.logs[logIndex].order || "";
  $("editAmountInput").value = Number(customer.logs[logIndex].amount || 0);
  $("editLogStatus").textContent = "";
  $("editLogModal").classList.remove("hidden");
}

function recalculateCustomerBalances(customer) {
  const logs = Array.isArray(customer.logs) ? customer.logs : [];
  if (!logs.length) return;

  // 로그는 최신순이므로 가장 오래된 기록의 '차감 전 잔액'을 기준으로 다시 계산
  const oldest = logs[logs.length - 1];
  let runningBalance = Number(oldest.balance || 0) + Number(oldest.amount || 0);

  for (let i = logs.length - 1; i >= 0; i--) {
    runningBalance -= Number(logs[i].amount || 0);
    logs[i].balance = runningBalance;
  }
  customer.balance = runningBalance;
}

async function saveEditedLog() {
  const customer = ledger.customers.find(c => Number(c.id) === Number(editingLogCustomerId));
  if (!customer || editingLogIndex == null || !customer.logs?.[editingLogIndex]) return;

  const order = $("editOrderInput").value.trim();
  const amount = Number($("editAmountInput").value);
  if (!order) return alert("주문 내용을 입력해주세요.");
  if (!Number.isFinite(amount) || amount <= 0) return alert("차감 가격을 올바르게 입력해주세요.");

  const backup = JSON.parse(JSON.stringify(customer));
  customer.logs[editingLogIndex].order = order;
  customer.logs[editingLogIndex].amount = amount;
  recalculateCustomerBalances(customer);

  if (customer.balance < 0) {
    Object.keys(customer).forEach(k => delete customer[k]);
    Object.assign(customer, backup);
    return alert("수정 후 잔액이 음수가 됩니다. 금액을 확인해주세요.");
  }

  const saved = await saveJson();
  if (!saved) {
    Object.keys(customer).forEach(k => delete customer[k]);
    Object.assign(customer, backup);
    return;
  }

  $("editLogModal").classList.add("hidden");
  renderList();
  openLog(editingLogCustomerId);
}

$("openBtn").addEventListener("click", openJson);
$("saveBtn").addEventListener("click", saveJson);
$("searchInput").addEventListener("input", renderList);
$("backBtn").addEventListener("click", backToList);
$("deductBtn").addEventListener("click", deduct);
$("closeLogBtn").addEventListener("click", () => $("logModal").classList.add("hidden"));
$("logModal").addEventListener("click", e => {
  if (e.target === $("logModal")) $("logModal").classList.add("hidden");
});
$("saveEditLogBtn").addEventListener("click", saveEditedLog);
$("closeEditLogBtn").addEventListener("click", () => $("editLogModal").classList.add("hidden"));
$("editLogModal").addEventListener("click", e => {
  if (e.target === $("editLogModal")) $("editLogModal").classList.add("hidden");
});
</script>

  <div id="editLogModal" class="modal hidden">
    <div class="modal-box" style="max-width:520px;">
      <div class="modal-head">
        <h2 style="margin:0">로그 수정</h2>
        <button class="secondary" id="closeEditLogBtn">닫기</button>
      </div>
      <div style="margin-bottom:12px;">
        <label for="editOrderInput">주문 내용</label>
        <textarea id="editOrderInput"></textarea>
      </div>
      <div style="margin-bottom:12px;">
        <label for="editAmountInput">차감 가격</label>
        <input id="editAmountInput" type="number" min="0" step="100" />
      </div>
      <div class="toolbar">
        <button class="primary" id="saveEditLogBtn">수정 저장</button>
      </div>
      <div id="editLogStatus" class="status"></div>
    </div>
  </div>

</body>
</html>
