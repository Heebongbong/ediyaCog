<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#1A2C63" />
  <title>이디야 선결제 장부</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 서비스 키 게이트 (로그인) -->
  <div id="gateView" class="gate hidden">
    <form id="gateForm" class="gate-card">
      <div class="gate-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a3 3 0 0 1 0 6h-1"/><path d="M3 8h14v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
      </div>
      <h1>이디야 선결제 장부</h1>
      <p class="gate-desc">PIN을 입력하면 장부를 불러옵니다.</p>
      <label for="pinInput">PIN</label>
      <input id="pinInput" type="password" autocomplete="current-password" placeholder="PIN 입력" />
      <button type="submit" id="gateBtn" class="primary">로그인</button>
      <div id="gateError" class="gate-error"></div>
      <p class="gate-hint">PIN은 관리자에게 문의해주세요.</p>
    </form>
  </div>

  <!-- 로딩 스플래시 -->
  <div id="loadingView" class="splash hidden">
    <div class="spinner"></div>
    장부를 불러오는 중…
  </div>

  <!-- 앱 본체 -->
  <div id="appView" class="hidden">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a3 3 0 0 1 0 6h-1"/><path d="M3 8h14v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
          </span>
          이디야 선결제 장부
        </div>
        <div class="header-right">
          <span id="saveStatus" class="status-pill hidden"></span>
          <button id="refreshBtn" class="icon-btn" title="데이터 갱신">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <div class="menu-wrap">
            <button id="backupBtn" class="icon-btn" title="백업 관리">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>
            </button>
            <div id="backupMenu" class="menu hidden">
              <button id="menuCreateBackup">백업 생성</button>
              <button id="menuBackupList">백업 목록</button>
              <hr class="menu-divider" />
              <button id="menuArchive">로그 이월 정리</button>
              <button id="menuArchiveList">아카이브 목록</button>
            </div>
          </div>
          <button id="logoutBtn" class="icon-btn" title="로그아웃">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <!-- 목록 -->
      <section id="listView">
        <div class="list-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="searchInput" type="search" placeholder="고객 이름 검색" autocomplete="off" />
          </div>
          <button id="addCustomerBtn" class="primary">고객 등록</button>
        </div>

        <div class="card">
          <div class="card-head">
            <span id="customerCount"></span>
            <span id="totalBalance"></span>
          </div>
          <table>
            <thead>
              <tr>
                <th class="sortable" data-sort="name">고객명<span class="sort-mark"></span></th>
                <th class="col-money sortable" data-sort="balance">남은 잔액<span class="sort-mark"></span></th>
                <th class="col-log">로그</th>
              </tr>
            </thead>
            <tbody id="customerRows"></tbody>
          </table>
        </div>
        <button id="deletedLink" class="deleted-link hidden"></button>
      </section>

      <!-- 상세 -->
      <section id="detailView" class="hidden">
        <button id="backBtn" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          목록
        </button>
        <div class="card detail-card">
          <div class="detail-head">
            <h2 id="detailName"></h2>
            <span id="editBadge" class="badge hidden">기록 수정 중</span>
          </div>
          <div id="detailPhone" class="detail-phone hidden"></div>
          <div class="balance-hero">
            <span>현재 잔액</span>
            <strong id="detailBalance"></strong>
          </div>
          <div id="editInfo" class="edit-info hidden"></div>
          <div id="typeToggle" class="type-toggle">
            <button type="button" data-type="deduct" class="active">차감</button>
            <button type="button" data-type="charge">충전</button>
          </div>
          <form id="detailForm">
            <label id="orderLabel" for="orderInput">주문 내용</label>
            <textarea id="orderInput" placeholder="예: 아이스 아메리카노 2잔"></textarea>
            <label for="amountInput">금액</label>
            <div class="amount-field">
              <input id="amountInput" inputmode="numeric" autocomplete="off" placeholder="0" />
              <span class="unit">원</span>
            </div>
            <div id="formError" class="form-error"></div>
            <div class="form-actions">
              <button type="button" id="cancelEditBtn" class="secondary hidden">취소</button>
              <button type="submit" id="submitBtn" class="primary">차감하고 저장</button>
            </div>
          </form>
          <button type="button" id="deleteCustomerBtn" class="delete-customer-btn">고객 삭제</button>
        </div>
      </section>

      <!-- 삭제된 고객 -->
      <section id="deletedView" class="hidden">
        <button id="deletedBackBtn" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          목록
        </button>
        <div class="card">
          <div class="card-head">
            <span id="deletedCount"></span>
          </div>
          <table>
            <thead>
              <tr>
                <th>고객명</th>
                <th class="col-money">남은 잔액</th>
                <th class="col-log">로그</th>
                <th class="col-log">복구</th>
              </tr>
            </thead>
            <tbody id="deletedRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- 로그 팝업 -->
  <div id="logModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <h2 id="logTitle"></h2>
          <div id="logPhone" class="modal-phone hidden"></div>
        </div>
        <button id="closeLogBtn" class="icon-btn" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="logContent" class="modal-body"></div>
    </div>
  </div>

  <!-- 고객 등록 팝업 -->
  <div id="customerModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>고객 등록</h2>
        <button id="closeCustomerBtn" class="icon-btn" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="customerForm" class="modal-form">
        <label for="customerNameInput">고객 이름</label>
        <input id="customerNameInput" autocomplete="off" placeholder="예: 홍길동" />
        <label for="customerPhoneInput">연락처 (선택)</label>
        <input id="customerPhoneInput" inputmode="numeric" autocomplete="off" placeholder="010-0000-0000" maxlength="13" />
        <label for="customerAmountInput">최초 충전 금액</label>
        <div class="amount-field">
          <input id="customerAmountInput" inputmode="numeric" autocomplete="off" placeholder="0" />
          <span class="unit">원</span>
        </div>
        <div id="customerError" class="form-error"></div>
        <div class="form-actions">
          <button type="submit" id="customerSubmitBtn" class="primary">등록</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 백업 관리 팝업 -->
  <div id="backupModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>백업 목록</h2>
        <button id="closeBackupBtn" class="icon-btn" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="backupContent" class="modal-body"></div>
    </div>
  </div>

  <!-- 아카이브 목록 팝업 -->
  <div id="archiveModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>아카이브 목록</h2>
        <button id="closeArchiveBtn" class="icon-btn" title="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="archiveContent" class="modal-body"></div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
